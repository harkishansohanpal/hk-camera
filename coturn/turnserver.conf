# HK Camera — Coturn TURN Server Configuration
# ────────────────────────────────────────────────────────────────
# Used by docker-compose.yml coturn service.
# Generate a strong shared secret and set COTURN_SECRET in backend .env

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=${COTURN_EXTERNAL_IP}

# Authentication via time-limited shared secret
use-auth-secret
static-auth-secret=${COTURN_SECRET}
realm=${COTURN_REALM}

# Generate short-lived credentials
lt-cred-mech

# Performance
fingerprint
no-multicast-peers
mobility
no-cli

# Logging
syslog
simple-log

# TLS (optional – mount certs at /etc/ssl/turn)
# cert=/etc/ssl/turn/fullchain.pem
# pkey=/etc/ssl/turn/privkey.pem

name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ── Frontend: Cloudflare Pages ──────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test

      - run: npm run build
        env:
          VITE_API_URL: https://hk-camera-backend.fly.dev
          VITE_SOCKET_URL: https://hk-camera-backend.fly.dev

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=hk-camera --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: Run frontend regression tests
        run: npx playwright test e2e/regression.spec.js --reporter=github
        env:
          CI: true

  # ── Backend: Fly.io ─────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    if: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app hk-camera-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Post-deploy smoke tests (production) ────────────────────
  smoke:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright
        run: npx playwright install --with-deps chromium chromium-headless-shell
        working-directory: frontend
      - name: Wait for deployment to settle
        run: sleep 30
      - name: Run smoke tests against production
        run: npx playwright test e2e/smoke.spec.js --reporter=github
        working-directory: frontend
        env:
          CI: true

name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ── Frontend: Cloudflare Pages ──────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Download ML model
        run: |
          mkdir -p public/models
          curl -L "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolov8n.onnx" \
            -o public/models/yolov8n.onnx

      - name: Run tests
        run: npm test

      - run: npm run build
        env:
          VITE_API_URL: https://hk-camera-backend.fly.dev
          VITE_SOCKET_URL: https://hk-camera-backend.fly.dev

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=hk-camera --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ── Backend: Fly.io ─────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

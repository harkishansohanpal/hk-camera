name: Log Report

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason (broadcast_start, broadcast_stop, heartbeat, manual)'
        default: 'manual'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate log report
        run: node scripts/generate-log-report.js
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Commit report
        run: |
          git config user.name "hk-camera-bot"
          git config user.email "bot@hkcamera.app"
          git add logs/
          if git diff --cached --quiet; then
            echo "No new logs to commit"
          else
            git commit -m "log report $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi

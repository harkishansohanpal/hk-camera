name: Stress Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to test against'
        type: choice
        options:
          - local
          - prod
        default: 'local'
      duration:
        description: 'Monitor duration per scenario (ms)'
        default: '300000'
      viewer_count:
        description: 'Concurrent viewers'
        default: '3'
      reconnect_cycles:
        description: 'Reconnect cycles'
        default: '20'

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hkcam_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── Backend (local only) ──────────────────────────────────
      - name: Install backend deps
        if: ${{ github.event.inputs.target != 'prod' }}
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        if: ${{ github.event.inputs.target != 'prod' }}
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        if: ${{ github.event.inputs.target != 'prod' }}
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hkcam_test

      - name: Start backend
        if: ${{ github.event.inputs.target != 'prod' }}
        working-directory: backend
        run: |
          node src/index.js &
          npx wait-on http://localhost:5001/api/health --timeout 30000
        env:
          NODE_ENV: test
          PORT: 5001
          CLIENT_URL: http://localhost:4173
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hkcam_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-stress-test-jwt-secret
          JWT_REFRESH_SECRET: ci-stress-test-refresh-secret
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          RATE_LIMIT_MAX: 10000
          STORAGE_STRATEGY: local
          LOCAL_UPLOAD_DIR: ./uploads
          LOCAL_RECORDING_DIR: ./recordings
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

      # ── Frontend ─────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium chromium-headless-shell

      # ── Frontend build + preview (local only) ────────────────
      - name: Build frontend
        if: ${{ github.event.inputs.target != 'prod' }}
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5001
          VITE_SOCKET_URL: http://localhost:5001

      - name: Start frontend preview server
        if: ${{ github.event.inputs.target != 'prod' }}
        working-directory: frontend
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 30000

      # ── Stress tests ─────────────────────────────────────────
      - name: Run stress tests
        working-directory: frontend
        run: npx playwright test e2e/stress/ --reporter=github --timeout=3600000
        env:
          CI: true
          STRESS_API_BASE: ${{ github.event.inputs.target == 'prod' && 'https://hk-camera-backend.fly.dev' || 'http://localhost:5001' }}
          STRESS_FRONTEND_URL: ${{ github.event.inputs.target == 'prod' && 'https://hk-camera.pages.dev' || 'http://localhost:4173' }}
          STRESS_DURATION: ${{ github.event.inputs.duration || '300000' }}
          STRESS_VIEWER_COUNT: ${{ github.event.inputs.viewer_count || '3' }}
          STRESS_RECONNECT_CYCLES: ${{ github.event.inputs.reconnect_cycles || '20' }}

      # ── Results ──────────────────────────────────────────────
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Generate log report
        if: always()
        run: |
          API_FLAG="--api http://localhost:5001"
          if [ "${{ github.event.inputs.target }}" = "prod" ]; then
            API_FLAG="--api https://hk-camera-backend.fly.dev"
          fi
          node scripts/generate-log-report.js $API_FLAG \
            --admin-email "${{ secrets.ADMIN_EMAIL }}" \
            --admin-password "${{ secrets.ADMIN_PASSWORD }}"
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        continue-on-error: true

      - name: Commit log report
        if: always()
        run: |
          git config user.name "hk-camera-bot"
          git config user.email "bot@hkcamera.app"
          git add logs/
          if git diff --cached --quiet; then
            echo "No new logs to commit"
          else
            git commit -m "log report after stress test $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi

      - name: Show backend logs
        if: ${{ always() && github.event.inputs.target != 'prod' }}
        run: |
          echo "=== Last 100 backend log lines ==="
          docker logs $(docker ps -q --filter name=hk_backend 2>/dev/null) 2>/dev/null | tail -100 || \
            cat /tmp/backend*.log 2>/dev/null | tail -100 || \
            echo "No backend logs found"

name: Performance Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC

jobs:
  k6:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hkcam_perf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hkcam_perf

      - name: Start backend
        working-directory: backend
        run: |
          node src/index.js &
          npx wait-on http://localhost:5000/api/health --timeout 30000
        env:
          NODE_ENV: test
          PORT: 5000
          CLIENT_URL: http://localhost:5173
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hkcam_perf
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: perf-test-jwt-secret
          JWT_REFRESH_SECRET: perf-test-refresh-secret
          RATE_LIMIT_MAX: 10000
          STORAGE_STRATEGY: local

      - name: Install k6
        run: |
          curl -L -o k6.tar.gz https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          tar xzf k6.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/

      - name: Run health smoke test
        run: k6 run k6/health.js --summary-export=k6-health.json

      - name: Run auth load test
        run: k6 run k6/auth.js --summary-export=k6-auth.json

      - name: Run cameras load test
        run: k6 run k6/cameras.js --summary-export=k6-cameras.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: k6-*.json
          retention-days: 30

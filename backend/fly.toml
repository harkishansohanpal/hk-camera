app = "hk-camera-backend"

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  PORT = "5000"
  CLIENT_URL = "https://hk-camera.pages.dev"
  STORAGE_STRATEGY = "s3"
  LOCAL_UPLOAD_DIR = "/app/uploads"
  LOCAL_RECORDING_DIR = "/app/recordings"

[[crons]]
  schedule = "0 3 * * *"
  command = "node scripts/purge-old-recordings.js"
  process = "app"

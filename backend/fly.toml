app = "hk-camera-backend"

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  PORT = "5000"
  STORAGE_STRATEGY = "local"
  LOCAL_UPLOAD_DIR = "/app/uploads"
  LOCAL_RECORDING_DIR = "/app/recordings"
